# Isolated Raspberry Pi lab DHCP configuration
# install in /etc/dnsmasq.d/agrajag-dhcp.conf
# Only listen on the dedicated test interface
interface=eth0
bind-dynamic

# Do not provide DNS service from the Pi itself
port=0

# DHCP address range and lease duration
dhcp-range=eth0,192.168.77.10,192.168.77.20,255.255.255.0,12h

# DHCP option 3: default gateway
dhcp-option=eth0,3,192.168.77.1

# DHCP option 6: DNS resolvers
dhcp-option=eth0,6,208.67.222.222,208.67.220.220

# Treat this server as authoritative for this isolated subnet
dhcp-authoritative

# Store leases in the normal dnsmasq lease file
dhcp-leasefile=/var/lib/misc/dnsmasq.leases

# Log DHCP transactions
log-dhcp
``
